<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <h1>Form</h1>
    <form id="container" novalidate>
        <label for="uname">Username</label>
        <input type="text" id="uname" autocomplete="username" aria-describedby="usernameInfo">
        <p id="usernameInfo" aria-live="polite"></p>
        <br>
        <br>
        <label for="pass">Password</label>
        <input type="password" id="pass" autocomplete="new-password" aria-describedby="passwordInfo">
        <p id="passwordInfo" aria-live="polite"></p>
        <br>
        <br>
        <label for="confirmation">Confirm password</label>
        <input type="password" id="confirmation" autocomplete="new-password" aria-describedby="confirmationInfo">
        <p id="confirmationInfo" aria-live="polite"></p>
        <br>
        <br>
        <button type="submit" id="submit">Submit</button>
    </form>
    <script src="script.js"></script>
</body>

</html>
