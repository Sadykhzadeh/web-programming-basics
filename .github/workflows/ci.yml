name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # the database lessons (7.3, 13.1, example 6 of 7-nodejs-start) run against
    # a real server here, so none of their tests is skipped
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci-password"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_PASSWORD: ci-password
      # a missing server fails the database tests instead of skipping them
      REQUIRE_MYSQL: '1'

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      # the root holds the tests, every Node lesson has its own dependencies
      - name: Install
        run: |
          for dir in . 7-nodejs-start 7.2-task 7.3-task-with-db 8-express \
            12-simple-session-auth 13-quiz 13.1-quiz; do
            (cd "$dir" && npm ci --no-audit --no-fund)
          done

      - name: Test
        run: npm test

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Audit
        run: |
          failed=0
          for dir in . 7-nodejs-start 7.2-task 7.3-task-with-db 8-express \
            12-simple-session-auth 13-quiz 13.1-quiz; do
            echo "== $dir"
            (cd "$dir" && npm audit) || failed=1
          done
          exit $failed
